<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Мини-Игры</title>
  </head>
  <body>
    <div id="app">
      <div id="menu">
        <h1>Мини-Игры</h1>
        <p class="subtitle">Коллекция простых игр — работает офлайн</p>
        <div class="menu-grid">
          <button class="menu-card" data-game="minesweeper"><span class="menu-icon">💣</span><span class="menu-name">Сапёр</span></button>
          <button class="menu-card" data-game="tetris"><span class="menu-icon">🧱</span><span class="menu-name">Тетрис</span></button>
          <button class="menu-card" data-game="sudoku"><span class="menu-icon">🔢</span><span class="menu-name">Судоку</span></button>
          <button class="menu-card" data-game="blockblitz">
            <span class="menu-icon">🎨</span><span class="menu-name">Блок Бласт</span>
          </button>
        </div>
      </div>
      <div id="game" style="display: none"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
